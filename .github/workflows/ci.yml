name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sacra-lux
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: sacra-lux/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install Playwright browser
        # The apt mirror download has stalled for more than 10 minutes on some runs (#442).
        # Stop a try after 8 minutes, end the apt process that it left behind (it holds
        # the dpkg lock), and try again. Up to 3 tries. Packages that apt already
        # downloaded stay in its cache, so a later try has less to fetch.
        timeout-minutes: 30
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99ci-retries
          for attempt in 1 2 3; do
            if timeout --kill-after=10 480 npx playwright install --with-deps chromium webkit; then exit 0; fi
            echo "Playwright install attempt $attempt failed or timed out."
            sudo pkill -9 -x apt-get || true
            sudo dpkg --configure -a || true
          done
          exit 1

      - name: Lint
        run: npm run lint

      - name: Check package version sync
        run: npm run check:version-sync

      - name: Run unit and integration tests with coverage floors
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: sacra-lux/coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            sacra-lux/playwright-report/
            sacra-lux/test-results/
            sacra-lux/tests/e2e/*-snapshots/
          if-no-files-found: ignore
          retention-days: 7

  timezones:
    name: timers (${{ matrix.tz }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tz:
          - America/New_York
          - America/Chicago
          - Europe/London
          - Asia/Kolkata
          - Pacific/Auckland
    env:
      TZ: ${{ matrix.tz }}
    defaults:
      run:
        working-directory: sacra-lux
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: sacra-lux/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run clock and timer tests in this time zone
        run: npx jest --config ./jest.config.cjs tests/integration/massStartClock.test.js tests/integration/mediaTiming.test.js tests/integration/movieAdvance.test.js tests/integration/phaseTimers.test.js tests/unit/state.test.js --runInBand

  # Publish the coverage percentage as a shields.io endpoint file on the badges branch.
  # The job uses only GITHUB_TOKEN; no external service token is needed.
  coverage-badge:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
          path: coverage

      - name: Publish coverage badge data
        run: |
          pct=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct")
          color=$(node -p "const p=$pct; p>=85?'brightgreen':p>=70?'yellow':'red'")
          mkdir -p /tmp/badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$pct" "$color" > /tmp/badges/coverage.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin badges:badges; then git checkout badges; else git checkout --orphan badges; fi
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/badges/coverage.json coverage.json
          git add coverage.json
          git commit -m "Update coverage badge to ${pct}%" || exit 0
          git push origin HEAD:badges

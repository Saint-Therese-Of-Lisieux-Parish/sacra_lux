name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sacra-lux
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: sacra-lux/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Check package version sync
        run: npm run check:version-sync

      - name: Run unit and integration tests with coverage floors
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: sacra-lux/coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            sacra-lux/playwright-report/
            sacra-lux/test-results/
            sacra-lux/tests/e2e/*-snapshots/
          if-no-files-found: ignore
          retention-days: 7

  timezones:
    name: timers (${{ matrix.tz }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tz:
          - America/New_York
          - America/Chicago
          - Europe/London
          - Asia/Kolkata
          - Pacific/Auckland
    env:
      TZ: ${{ matrix.tz }}
    defaults:
      run:
        working-directory: sacra-lux
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: sacra-lux/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run clock and timer tests in this time zone
        run: npx jest --config ./jest.config.cjs tests/integration/massStartClock.test.js tests/integration/mediaTiming.test.js tests/integration/movieAdvance.test.js tests/unit/state.test.js --runInBand

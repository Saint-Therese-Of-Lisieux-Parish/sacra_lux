name: Smoke

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packaged-smoke:
    name: packaged smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-intel
            os: macos-15-intel
            build: --mac --x64
            appPath: dist/mac/Sacra Lux.app/Contents/MacOS/Sacra Lux
          - name: macos-arm
            os: macos-latest
            build: --mac --arm64
            appPath: dist/mac-arm64/Sacra Lux.app/Contents/MacOS/Sacra Lux
          - name: windows
            os: windows-latest
            build: --win --x64
            appPath: dist/win-unpacked/Sacra Lux.exe
    defaults:
      run:
        working-directory: sacra-lux
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: sacra-lux/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build unpacked app
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2; do
            build_log=$(mktemp)
            if npx electron-builder --dir ${{ matrix.build }} "--config.directories.output=dist" "--config.mac.forceCodeSigning=false" 2>&1 | tee "$build_log"; then
              rm -f "$build_log"
              exit 0
            fi
            if ! grep -q "Response code 504" "$build_log" || [ "$attempt" -eq 2 ]; then
              rm -f "$build_log"
              exit 1
            fi
            echo "::warning::Electron download returned HTTP 504; retrying the build."
            rm -f "$build_log"
          done

      - name: Smoke test packaged app
        env:
          SMOKE_APP_PATH: ${{ matrix.appPath }}
          SACRA_LUX_PORT: "17841"
        shell: bash
        run: node ./scripts/smoke-packaged.js 2>&1 | tee smoke.log

      - name: Upload smoke log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-log-${{ matrix.name }}
          path: sacra-lux/smoke.log
          if-no-files-found: ignore
          retention-days: 7

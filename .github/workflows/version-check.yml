name: Version Bump Check

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Get PR version
        id: pr
        run: |
          version=$(node -p "require('./sacra-lux/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Get base version
        id: base
        run: |
          git fetch origin master --depth=1
          version=$(git show origin/master:sacra-lux/package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        env:
          PR_VERSION: ${{ steps.pr.outputs.version }}
          BASE_VERSION: ${{ steps.base.outputs.version }}
        run: |
          echo "PR version:   $PR_VERSION"
          echo "Base version: $BASE_VERSION"
          node sacra-lux/scripts/check-version-bump.js "$PR_VERSION" "$BASE_VERSION"

name: Version Bump Check

on:
  pull_request:
    branches: [master]

jobs:
  check-version:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Get PR version
        id: pr
        run: |
          version=$(node -p "require('./sacra-lux/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Get base version
        id: base
        run: |
          git fetch origin master --depth=1
          version=$(git show origin/master:sacra-lux/package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        run: |
          echo "PR version:   ${{ steps.pr.outputs.version }}"
          echo "Base version: ${{ steps.base.outputs.version }}"
          node sacra-lux/scripts/check-version-bump.js "${{ steps.pr.outputs.version }}" "${{ steps.base.outputs.version }}"

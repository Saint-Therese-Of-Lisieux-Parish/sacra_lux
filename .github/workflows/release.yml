name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  validate:
    name: Validate version tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read package version
        id: version
        run: echo "version=$(node -p "require('./sacra-lux/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Compare tag with package version
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          expected="v${VERSION}"
          echo "Tag:      ${TAG}"
          echo "Expected: ${expected}"
          if [ "${TAG}" != "${expected}" ]; then
            echo "::error::Tag ${TAG} does not match package version ${expected}"
            exit 1
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS ARM64
            os: macos-15
            build: --mac zip dmg --arm64
            artifact: mac-arm64
          - name: macOS x64
            os: macos-15-intel
            build: --mac zip dmg --x64
            artifact: mac-x64
          - name: Windows x64
            os: windows-latest
            build: --win zip --x64
            artifact: win-x64
    defaults:
      run:
        working-directory: sacra-lux
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check macOS signing credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY \
            APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then
              missing+=("${name}")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing macOS signing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          certificate_file="${RUNNER_TEMP}/sacra-lux-signing.p12"
          keychain_file="${RUNNER_TEMP}/sacra-lux-signing.keychain-db"
          certificate_data="${CSC_LINK}"

          if [[ "${certificate_data}" == data:* ]]; then
            certificate_data="${certificate_data#*,}"
          fi

          if ! printf '%s' "${certificate_data}" | base64 -D > "${certificate_file}"; then
            echo "::error::CSC_LINK must contain base64-encoded .p12 data."
            exit 1
          fi

          security create-keychain -p "${CSC_KEY_PASSWORD}" "${keychain_file}"
          security set-keychain-settings -lut 21600 "${keychain_file}"
          security unlock-keychain -p "${CSC_KEY_PASSWORD}" "${keychain_file}"
          security import "${certificate_file}" \
            -k "${keychain_file}" \
            -P "${CSC_KEY_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${CSC_KEY_PASSWORD}" \
            "${keychain_file}"
          security list-keychains -d user -s \
            "${keychain_file}" \
            "${HOME}/Library/Keychains/login.keychain-db"

          full_identity="$(security find-identity -v -p codesigning "${keychain_file}" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' \
            | head -n 1)"
          if [ -z "${full_identity}" ]; then
            echo "::error::The imported keychain has no Developer ID Application identity."
            exit 1
          fi
          identity="${full_identity#Developer ID Application: }"
          echo "CSC_NAME=${identity}" >> "${GITHUB_ENV}"

      - name: Build signed and notarized macOS artifacts
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ runner.temp }}/sacra-lux-signing.p12
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          apple_key_file="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "${APPLE_API_KEY}" > "${apple_key_file}"
          export APPLE_API_KEY="${apple_key_file}"
          for attempt in 1 2 3; do
            rm -rf dist
            if npx electron-builder ${{ matrix.build }} --publish never \
              "--config.directories.output=dist"; then
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::The macOS build failed after three attempts."
              exit 1
            fi
            delay=$((attempt * 30))
            echo "::warning::The macOS build failed. Retrying in ${delay} seconds."
            sleep "${delay}"
          done

      - name: Build Windows ZIP
        if: runner.os == 'Windows'
        run: >-
          npx electron-builder ${{ matrix.build }} --publish never
          "--config.directories.output=dist"

      - name: Verify macOS artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg=$(find dist -maxdepth 1 -name '*.dmg' -print -quit)
          if [ -z "${dmg}" ]; then
            echo "::error::No macOS DMG file found in dist"
            exit 1
          fi
          hdiutil verify "${dmg}"

          mount_dir="${RUNNER_TEMP}/sacra-lux-dmg"
          mkdir -p "${mount_dir}"
          cleanup() {
            hdiutil detach "${mount_dir}" -quiet || true
          }
          trap cleanup EXIT
          hdiutil attach "${dmg}" -readonly -nobrowse -noautoopen \
            -mountpoint "${mount_dir}"

          app=$(find "${mount_dir}" -maxdepth 1 -type d -name '*.app' \
            -print -quit)
          if [ -z "${app}" ]; then
            echo "::error::No macOS application found in the DMG"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "${app}"
          spctl --assess --type execute --verbose=4 "${app}"
          xcrun stapler validate "${app}"
          cleanup
          trap - EXIT

      - name: Normalize ZIP name
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          source=$(find dist -maxdepth 1 -name '*.zip' -print -quit)
          if [ -z "${source}" ]; then
            echo "::error::No ZIP file found in dist"
            exit 1
          fi
          target="dist/Sacra-Lux-${version}-${{ matrix.artifact }}.zip"
          mv "${source}" "${target}"

      - name: Normalize DMG name
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          source=$(find dist -maxdepth 1 -name '*.dmg' -print -quit)
          if [ -z "${source}" ]; then
            echo "::error::No DMG file found in dist"
            exit 1
          fi
          target="dist/Sacra-Lux-${version}-${{ matrix.artifact }}.dmg"
          mv "${source}" "${target}"

      - name: Sign, notarize, and staple DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          dmg=$(find dist -maxdepth 1 -name '*.dmg' -print -quit)
          if [ -z "${dmg}" ]; then
            echo "::error::No macOS DMG file found in dist"
            exit 1
          fi
          codesign --force --sign "Developer ID Application: ${CSC_NAME}" \
            --timestamp "${dmg}"
          codesign --verify --strict --verbose=2 "${dmg}"
          codesign -dv --verbose=2 "${dmg}" 2>&1 \
            | grep "Authority=Developer ID Application"

          apple_key_file="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "${APPLE_API_KEY}" > "${apple_key_file}"
          for attempt in 1 2 3; do
            if xcrun notarytool submit "${dmg}" \
              --key "${apple_key_file}" \
              --key-id "${APPLE_API_KEY_ID}" \
              --issuer "${APPLE_API_ISSUER}" \
              --wait; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::DMG notarization failed after three attempts."
              exit 1
            fi
            delay=$((attempt * 30))
            echo "::warning::DMG notarization failed. Retrying in ${delay} seconds."
            sleep "${delay}"
          done
          rm -f "${apple_key_file}"

          xcrun stapler staple "${dmg}"
          retry() {
            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              fi
              if [ "${attempt}" -eq 3 ]; then
                echo "::error::The command failed after three attempts: $*"
                return 1
              fi
              delay=$((attempt * 15))
              echo "::warning::The command failed. Retrying in ${delay} seconds."
              sleep "${delay}"
            done
          }
          retry xcrun stapler validate "${dmg}"
          retry spctl -a -t open --context context:primary-signature -vv "${dmg}"

      - name: Normalize ZIP name
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $source = Get-ChildItem -Path dist -Filter *.zip | Select-Object -First 1
          if (-not $source) {
            throw "No ZIP file found in dist"
          }
          $target = Join-Path dist "Sacra-Lux-$version-${{ matrix.artifact }}.zip"
          Move-Item -Path $source.FullName -Destination $target

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.artifact }}
          path: |
            sacra-lux/dist/Sacra-Lux-*.zip
            sacra-lux/dist/Sacra-Lux-*.dmg
          if-no-files-found: error

  attest:
    name: Attest build provenance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Attest release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.zip
            release/*.dmg

  scan:
    name: Scan release packages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Install Syft and Grype
        env:
          SYFT_VERSION: "1.55.0"
          # SHA-256 of syft_1.55.0_linux_amd64.tar.gz from the release checksums file.
          SYFT_SHA256: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d
          GRYPE_VERSION: "0.121.0"
          # SHA-256 of grype_0.121.0_linux_amd64.tar.gz from the release checksums file.
          GRYPE_SHA256: 64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -sSfL -o "${RUNNER_TEMP}/syft.tar.gz" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  ${RUNNER_TEMP}/syft.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/syft.tar.gz" -C "${RUNNER_TEMP}/bin" syft
          curl -sSfL -o "${RUNNER_TEMP}/grype.tar.gz" \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  ${RUNNER_TEMP}/grype.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/grype.tar.gz" -C "${RUNNER_TEMP}/bin" grype
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install asar
        run: npm install --prefix "${RUNNER_TEMP}/asar" @electron/asar@4.3.1

      # Syft does not read app.asar. The script extracts it, then runs Syft and Grype.
      - name: Scan each release ZIP
        env:
          ASAR: ${{ runner.temp }}/asar/node_modules/.bin/asar
        run: .github/scripts/scan-release-zips.sh release reports

      - name: Upload SBOM and Grype reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: reports/
          if-no-files-found: ignore

      - name: Upload Grype SARIF
        if: always() && hashFiles('reports/*.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: reports

  release:
    name: Publish release
    needs:
      - validate
      - build
      - attest
      - scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Download SBOM and Grype reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sbom
          path: release

      - name: Write checksums
        working-directory: release
        run: >-
          sha256sum ./*.zip ./*.dmg ./*.spdx.json ./*.cdx.json
          ./*.grype.json ./*.grype.sarif > SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release/* --clobber
            if [[ "${VERSION}" == *-* ]]; then
              gh release edit "${TAG}" --prerelease
            fi
            exit 0
          fi

          args=(--title "${TAG}" --generate-notes --verify-tag)
          if [[ "${VERSION}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${TAG}" release/* "${args[@]}"

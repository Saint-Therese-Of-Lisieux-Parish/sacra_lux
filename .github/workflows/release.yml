name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  validate:
    name: Validate version tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Read package version
        id: version
        run: echo "version=$(node -p "require('./sacra-lux/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Compare tag with package version
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          expected="v${VERSION}"
          echo "Tag:      ${TAG}"
          echo "Expected: ${expected}"
          if [ "${TAG}" != "${expected}" ]; then
            echo "::error::Tag ${TAG} does not match package version ${expected}"
            exit 1
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS ARM64
            os: macos-15
            build: --mac zip --arm64
            artifact: mac-arm64
          - name: macOS x64
            os: macos-15-intel
            build: --mac zip --x64
            artifact: mac-x64
          - name: Windows x64
            os: windows-latest
            build: --win zip --x64
            artifact: win-x64
    defaults:
      run:
        working-directory: sacra-lux
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: sacra-lux/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check macOS signing credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY \
            APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then
              missing+=("${name}")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing macOS signing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          certificate_file="${RUNNER_TEMP}/sacra-lux-signing.p12"
          keychain_file="${RUNNER_TEMP}/sacra-lux-signing.keychain-db"
          certificate_data="${CSC_LINK}"

          if [[ "${certificate_data}" == data:* ]]; then
            certificate_data="${certificate_data#*,}"
          fi

          if ! printf '%s' "${certificate_data}" | base64 -D > "${certificate_file}"; then
            echo "::error::CSC_LINK must contain base64-encoded .p12 data."
            exit 1
          fi

          security create-keychain -p "${CSC_KEY_PASSWORD}" "${keychain_file}"
          security set-keychain-settings -lut 21600 "${keychain_file}"
          security unlock-keychain -p "${CSC_KEY_PASSWORD}" "${keychain_file}"
          security import "${certificate_file}" \
            -k "${keychain_file}" \
            -P "${CSC_KEY_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${CSC_KEY_PASSWORD}" \
            "${keychain_file}"
          security list-keychains -d user -s \
            "${keychain_file}" \
            "${HOME}/Library/Keychains/login.keychain-db"

          identity="$(security find-identity -v -p codesigning "${keychain_file}" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' \
            | head -n 1)"
          if [ -z "${identity}" ]; then
            echo "::error::The imported keychain has no Developer ID Application identity."
            exit 1
          fi
          echo "CSC_NAME=${identity}" >> "${GITHUB_ENV}"

      - name: Build signed and notarized macOS ZIP
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ runner.temp }}/sacra-lux-signing.p12
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          apple_key_file="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "${APPLE_API_KEY}" > "${apple_key_file}"
          export APPLE_API_KEY="${apple_key_file}"
          npx electron-builder ${{ matrix.build }} --publish never \
            "--config.directories.output=dist"

      - name: Build Windows ZIP
        if: runner.os == 'Windows'
        run: >-
          npx electron-builder ${{ matrix.build }} --publish never
          "--config.directories.output=dist"

      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(find dist -type d -name '*.app' -print -quit)
          if [ -z "${app}" ]; then
            echo "::error::No macOS application found in dist"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "${app}"
          spctl --assess --type execute --verbose=4 "${app}"
          xcrun stapler validate "${app}"

      - name: Normalize ZIP name
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          source=$(find dist -maxdepth 1 -name '*.zip' -print -quit)
          if [ -z "${source}" ]; then
            echo "::error::No ZIP file found in dist"
            exit 1
          fi
          target="dist/Sacra-Lux-${version}-${{ matrix.artifact }}.zip"
          mv "${source}" "${target}"

      - name: Normalize ZIP name
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $source = Get-ChildItem -Path dist -Filter *.zip | Select-Object -First 1
          if (-not $source) {
            throw "No ZIP file found in dist"
          }
          $target = Join-Path dist "Sacra-Lux-$version-${{ matrix.artifact }}.zip"
          Move-Item -Path $source.FullName -Destination $target

      - name: Upload ZIP
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-${{ matrix.artifact }}
          path: sacra-lux/dist/Sacra-Lux-*.zip
          if-no-files-found: error

  attest:
    name: Attest build provenance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download ZIP files
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Attest ZIP files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.zip

  release:
    name: Publish release
    needs:
      - validate
      - build
      - attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download ZIP files
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Write checksums
        working-directory: release
        run: sha256sum ./*.zip > SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release/* --clobber
            if [[ "${VERSION}" == *-* ]]; then
              gh release edit "${TAG}" --prerelease
            fi
            exit 0
          fi

          args=(--title "${TAG}" --generate-notes --verify-tag)
          if [[ "${VERSION}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${TAG}" release/* "${args[@]}"
